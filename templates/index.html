<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каршеринг MVP</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Блок логина -->
    <div id="loginBlock" class="form-box">
        <h2>Вход в систему</h2>
        <form id="loginForm">
            <input type="text" id="login" placeholder="Логин" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
        <button type="button" class="toggle-link" onclick="showRegister()">Нет аккаунта? Зарегистрироваться</button>
    </div>

    <!-- Блок регистрации (скрыт по умолчанию) -->
    <div id="registerBlock" class="form-box" style="display: none;">
        <h2>Регистрация</h2>
        <form id="registerForm">
            <input type="email" id="regEmail" placeholder="Email" required>
            <!-- Строгая проверка: только +7 или 8, и ровно 10 цифр после -->
            <input type="tel" id="regPhone" placeholder="+79991234567" pattern="^(\+7|8)\d{10}$" title="Введите ровно 11 цифр: +7 или 8, затем 10 цифр (без пробелов и тире)" required>
            <input type="password" id="regPassword" placeholder="Придумайте пароль" required>
            <input type="password" id="regPasswordConfirm" placeholder="Повторите пароль" required>
            <p id="regError" class="error-msg">Пароли не совпадают!</p>
            <button type="submit">Зарегистрироваться</button>
        </form>
        <button type="button" class="toggle-link" onclick="showLogin()">Уже есть аккаунт? Войти</button>
    </div>

    <!-- Блок брони (скрыт до успешного логина) -->
    <div id="bookBlock" class="form-box" style="display: none;">
        <h2>Бронирование</h2>
        <p>Привет, <span id="usernameDisplay" style="font-weight: bold;"></span>!</p>
        <form id="bookForm">
            <label for="carSelect" style="display:block; text-align:left; margin-bottom:5px; font-size:14px;">Выберите машину:</label>
            <select id="carSelect" required>
                <option value="">Загрузка...</option>
            </select>
            <button type="submit">Забронировать</button>
        </form>
        <p id="message" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
